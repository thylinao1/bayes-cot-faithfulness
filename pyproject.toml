[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayes-cot-faithfulness"
version = "0.1.0"
description = "Bayesian causal mediation analysis for LLM chain-of-thought faithfulness."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Maksim Silchenko", email = "mthylinao@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pymc>=5.10",
    # Pin below arviz 1.0: PyMC 5.x targets the classic arviz line, and arviz 1.0
    # changed from_dict and the summary API. Unpinned, CI resolved to 1.0 and broke.
    "arviz>=0.17,<1.0",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/thylinao1/bayes-cot-faithfulness"
Repository = "https://github.com/thylinao1/bayes-cot-faithfulness"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
