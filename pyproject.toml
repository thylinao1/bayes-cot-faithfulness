[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayes-cot-faithfulness"
version = "0.1.0"
description = "Bayesian causal mediation analysis for LLM chain-of-thought faithfulness."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Maksim Silchenko", email = "mthylinao@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pymc>=5.10",
    # Pin below arviz 1.0: PyMC 5.x targets the classic arviz line, and arviz 1.0
    # changed from_dict and the summary API. Unpinned, CI resolved to 1.0 and broke.
    "arviz>=0.17,<1.0",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.16.6,<0.17",
    "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/thylinao1/bayes-cot-faithfulness"
Repository = "https://github.com/thylinao1/bayes-cot-faithfulness"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# FROZEN measurement instruments. These three files are pinned by the
# pre-registration amendment protocol (tests/test_frozen_guard.py fingerprints
# interventions.py's regexes, templates and CoT instruction), so they must stay
# byte-identical to main and a lint finding in them can never be fixed by
# editing the file. Ruff is told to skip them instead of proposing edits it is
# not allowed to make. A genuine defect in one of these goes through the
# amendment protocol in the owning pre-registration, not through the linter.
# As of ruff 0.16.6 only ollama_client.py actually trips a rule (BLE001, the
# blind except in the availability probe); the other two are listed so a future
# ruff release with a wider default rule set cannot force an edit either.
"src/bayes_cot_faithfulness/interventions.py" = ["ALL"]
"experiments/groq_client.py" = ["ALL"]
"experiments/ollama_client.py" = ["ALL"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
